name: Build & Release AuraPet

# Releases stay manual: only a human-pushed `v*` tag publishes. The
# workflow_dispatch path is a dry-run that builds and uploads Actions artifacts
# without touching GitHub Releases. Linux-first: Godot body + Node SEA daemon
# replace the old electron-builder outputs (Epic #7 / issue #15).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts only; do not publish a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  GODOT_RELEASE: 4.7.2-stable
  GODOT_TEMPLATE_VERSION: 4.7.2.stable

jobs:
  build-linux:
    name: Linux AppImage + deb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Godot binary and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/aurapet-godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-linux-v2

      - name: Install Godot, export templates and squashfs tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/aurapet-godot"
          BIN="$HOME/.cache/aurapet-godot/Godot_v${GODOT_RELEASE}_linux.x86_64"
          if [ ! -x "$BIN" ]; then
            curl -fL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            unzip -o /tmp/godot.zip -d "$HOME/.cache/aurapet-godot"
            chmod +x "$BIN"
          fi
          if [ ! -f "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/linux_release.x86_64" ]; then
            curl -fL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            rm -rf /tmp/godot-templates
            mkdir -p /tmp/godot-templates
            unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
            mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
            # The .tpz stores the template files directly under templates/.
            mv /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}/"
          fi
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Build AppImage + deb
        run: npm run dist:linux

      - name: Smoke packaged daemon (loopback only, no window)
        run: |
          set -euo pipefail
          export AURAPET_CONFIG_DIR="$RUNNER_TEMP/aurapet-ci"
          export AURAPET_APP_DIR="$PWD/dist/linux/AppDir/usr/lib/aurapet"
          export AURAPET_BRIDGE_PORT=48961 AURAPET_UI_PORT=48962 AURAPET_MCP_PORT=48963
          "$AURAPET_APP_DIR/aurapet-daemon" &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -s -o /dev/null "http://127.0.0.1:48962/"; then break; fi
            sleep 0.2
          done
          ui=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:48962/")
          mcp=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:48963/mcp" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          echo "ui=$ui mcp=$mcp"
          test "$ui" = "403"
          test "$mcp" = "401"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraPet-Linux
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows exe + zip
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Godot binary and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/aurapet-godot
            ~/AppData/Roaming/Godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-windows-v2

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/aurapet-godot"
          BIN="$HOME/aurapet-godot/Godot_v${GODOT_RELEASE}_win64.exe"
          if [ ! -f "$BIN" ]; then
            curl -fL -o /tmp/godot-win.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_win64.exe.zip"
            unzip -o /tmp/godot-win.zip -d "$HOME/aurapet-godot"
          fi
          # Godot on Windows reads templates from %APPDATA%\Godot.
          if command -v cygpath >/dev/null; then APP_DATA="$(cygpath -u "$APPDATA")"; else APP_DATA="$APPDATA"; fi
          TPL_DIR="$APP_DATA/Godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          if [ ! -f "$TPL_DIR/windows_release_x86_64.exe" ]; then
            curl -fL -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            rm -rf /tmp/godot-templates
            mkdir -p /tmp/godot-templates
            unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
            mkdir -p "$TPL_DIR"
            # The .tpz stores the template files directly under templates/.
            mv /tmp/godot-templates/templates/* "$TPL_DIR/"
          fi
          # Git Bash paths (/c/...) are not valid to Node on Windows.
          if command -v cygpath >/dev/null; then BIN_FOR_ENV="$(cygpath -w "$BIN")"; else BIN_FOR_ENV="$BIN"; fi
          echo "GODOT_BIN=$BIN_FOR_ENV" >> "$GITHUB_ENV"

      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Build Windows package
        run: npm run dist:win

      - name: Smoke packaged daemon (loopback only, no window)
        shell: pwsh
        run: |
          $env:AURAPET_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'aurapet-ci'
          $env:AURAPET_APP_DIR = Join-Path (Get-Location).Path 'dist/windows/AuraPet-win64'
          $env:AURAPET_BRIDGE_PORT = '48961'
          $env:AURAPET_UI_PORT = '48962'
          $env:AURAPET_MCP_PORT = '48963'
          $daemon = Start-Process -FilePath (Join-Path $env:AURAPET_APP_DIR 'aurapet-daemon.exe') -PassThru -WindowStyle Hidden
          try {
            $ui = $null
            for ($i = 0; $i -lt 100; $i++) {
              try {
                $ui = (Invoke-WebRequest -Uri 'http://127.0.0.1:48962/' -SkipHttpErrorCheck -TimeoutSec 2).StatusCode
                break
              } catch { Start-Sleep -Milliseconds 200 }
            }
            $mcp = (Invoke-WebRequest -Uri 'http://127.0.0.1:48963/mcp' -Method Post `
              -ContentType 'application/json' `
              -Body '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' `
              -SkipHttpErrorCheck -TimeoutSec 5).StatusCode
            Write-Host "ui=$ui mcp=$mcp"
            if ($ui -ne 403) { throw "ui expected 403, got $ui" }
            if ($mcp -ne 401) { throw "mcp expected 401, got $mcp" }
          } finally {
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraPet-Windows
          path: dist/windows/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release (tag only)
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || inputs.dry_run == false)
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: AuraPet-Linux
          path: release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: AuraPet-Windows
          path: release

      - name: List release files
        run: ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
